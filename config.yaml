# HCS Safety Health Report automation settings. No secrets here (they live in .env).

template: "templates/002 - Safety Health Report (fixed).xlsx"   # adopted 2026-11-11: Scorecard, COUNTIFS and open-survey penalty fixes (original kept alongside)
output_dir: "output"
timezone: "America/Chicago"          # Procore timestamps are UTC; dates are written in this zone

procore:
  safety_survey_templates: ["Site Safety Inspection"]
  utv_templates: ["UTV Checklist"]
  incident_form_templates: ["Incident Report"]
  observation_type_custom_field: "custom_field_87826"   # "Fall Protection", "Housekeeping", ...

daily_log:
  cache_file: "data/daily_log_cache.json"
  refresh_days: 21              # re-check not-yet-completed days this far back (logs are often completed late)

# Procore project region -> report region (Table1 "Region" column)
region_map:
  HCS TEXAS: TX
  HCS NORTHEAST: NE
  HCS CALIFORNIA: West
  HCS SOUTHEAST: SE
  HCS MIDSOUTH: EC            # assumed (Table1 uses EC); extract.py logs any project where this disagrees with Table1

# Table1 project numbers to skip (e.g. projects the app is not meant to see)
skip_projects: []

workbook:
  # true = every data table is sized to its data. Requires the COUNTIFS fix (docs/stage5-proposals.md),
  # which the adopted "(fixed)" template has. Set back to false if you return to the original template.
  shrink_all_tables: true
  recalc_engine: auto          # auto | excel | libreoffice | none

report:
  score_threshold: null        # no flag section (chosen 2026-11-11). e.g. 0.70 flags projects below 70% at the top
  subject: "HCS Safety Health Report - {date}"

email:
  enabled: true                # false = write the email to output/<date>/ only, send nothing
  method: onedrive             # Power Automate flow sends it (new Outlook can't be scripted). Other options: outlook | graph | smtp
  to: ["ford.nwosu@hillwood.com", "john.shaw@hillwood.com", "Oscar.Martinez@Hillwood.com", "Mike.Lokhaiser@hillwood.com"]   # distribution list (added 2026-11-12)
  cc: []
  failure_to: ["ford.nwosu@hillwood.com"]   # failure notices go only here (blank = same as to)
  from: ""                     # smtp/graph only: sending mailbox
  onedrive:
    folder: "HCS Safety Report"  # folder inside your work OneDrive that the Power Automate flow watches
    root: ""                     # blank = your work OneDrive (Windows' OneDriveCommercial setting)
  smtp:
    host: "smtp.office365.com"
    port: 587
    starttls: true             # username/password from .env: SMTP_USERNAME, SMTP_PASSWORD
  graph:
    tenant_id: ""              # client id/secret from .env: GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET
